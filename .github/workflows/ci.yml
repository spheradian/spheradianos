name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  static-checks:
    name: Static & Config Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck shfmt

      - name: Run shellcheck and shfmt across all shell scripts
        run: |
          set -- \
            auto/config \
            auto/build \
            auto/clean \
            scripts/*.sh \
            config/includes.chroot/usr/lib/xsphereos/xsphere-session \
            config/includes.chroot/usr/lib/xsphereos/boot-watch \
            config/includes.chroot/etc/initramfs-tools/hooks/* \
            config/includes.chroot/etc/initramfs-tools/scripts/init-top/* \
            config/includes.chroot/etc/profile.d/*.sh
          for hook in config/hooks/live/*.chroot; do
            if [ -f "$hook" ]; then
              set -- "$@" "$hook"
            fi
          done
          shellcheck "$@"
          shfmt -d "$@"

      - name: Run Ruff lint and security checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check

      - name: Check Python formatting (Ruff)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check

      - name: Run Python unit and config tests
        run: |
          python3 -m unittest discover -s tests -v

  workflow-security:
    name: Workflow Security (actionlint & zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install shellcheck for actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run actionlint
        run: |
          mkdir -p /tmp/actionlint
          curl -fsSL -o /tmp/actionlint/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint/actionlint.tar.gz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint

      - name: Run zizmor workflow security audit
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: ".github .pre-commit-config.yaml"
          collect: all
          advanced-security: false
          annotations: true
          online-audits: false

  sast-opengrep:
    name: SAST (Opengrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Opengrep custom security rules
        run: |
          curl -fsSL -o /tmp/opengrep \
            https://github.com/opengrep/opengrep/releases/download/v2.0.0/opengrep_linux_x86
          echo "37e93f4da5fd04a18c5c1febbdd12f7e98dfccd4d0c9cf2593bcb25eeb462da0  /tmp/opengrep" | sha256sum -c
          chmod +x /tmp/opengrep
          /tmp/opengrep scan --config .opengrep/xsphereos-rules.yaml --error auto config scripts tests .github

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
