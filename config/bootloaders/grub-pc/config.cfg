set default=0
set timeout=0
set timeout_style=hidden
set gfxpayload=keep

# The menu stays hidden (ADR-002). Its look is set up on every boot anyway,
# because Esc can open it without running anything else here. That is cheap
# only because the font is a small ASCII subset made at build time
# (config/hooks/live/9100-spheradianos-grub-font.hook.binary); loading the full
# unicode.pf2 here delays every UEFI boot by about 0.8 s.
if loadfont /boot/grub/spheradian/ascii.pf2 ; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod gfxterm
    insmod png
    terminal_output gfxterm
    set theme=/boot/grub/spheradian/theme.txt
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray
set color_normal=light-gray/black
set color_highlight=black/light-gray

if insmod keystatus; then
    if keystatus --shift; then
        set timeout=-1
        set timeout_style=menu
    fi
fi
