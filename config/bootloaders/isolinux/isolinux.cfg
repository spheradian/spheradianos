# Zero-prompt boot (ADR-002) without a text-mode cursor (BOOT-EXPERIENCE.md 2).
# vesamenu.c32 puts up a black graphics screen (splash.png is plain black); its menu stays hidden unless a
# key is pressed within the half-second timeout. live.cfg boots the kernel with
# vga=current, so it inherits that graphics mode: syslinux would otherwise drop
# back to text mode, with a blinking cursor, for as long as the kernel loads.
ui vesamenu.c32
include menu.cfg
menu hidden
menu background splash.png
default live-amd64
timeout 5
