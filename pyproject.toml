[tool.ruff]
target-version = "py312"
line-length = 110
src = ["scripts", "tests"]
extend-exclude = [
  "chroot",
  "cache",
  "binary",
  ".build",
  ".claude",
  "local",
  "preview",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S311", "S603", "S607"]
"scripts/render-boot-preview.py" = ["S311"]
