rules:
  - id: spheradianos-python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: Do not invoke subprocess with shell=True; pass an explicit argv list instead.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: spheradianos-python-dangerous-exec
    languages: [python]
    severity: ERROR
    message: Avoid dynamic code execution (eval, exec, os.system).
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: os.system(...)

  - id: spheradianos-shell-curl-pipe-sh
    languages: [bash]
    severity: ERROR
    message: Do not pipe remote curl/wget output directly into a shell interpreter.
    metadata:
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
    pattern-either:
      - pattern: curl ... | sh
      - pattern: curl ... | sh ...
      - pattern: curl ... | bash
      - pattern: curl ... | bash ...
      - pattern: wget ... | sh
      - pattern: wget ... | sh ...
      - pattern: wget ... | bash
      - pattern: wget ... | bash ...

  - id: spheradianos-shell-chmod-world-writable
    languages: [bash]
    severity: ERROR
    message: Do not set world-writable permissions in image or build scripts.
    metadata:
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
    pattern-either:
      - pattern: chmod 777 ...
      - pattern: chmod 0777 ...
      - pattern: chmod -R 777 ...
      - pattern: chmod -R 0777 ...
      - pattern: chmod a+rwx ...
      - pattern: chmod -R a+rwx ...
      - pattern: chmod o+w ...
      - pattern: chmod -R o+w ...

  - id: spheradianos-workflow-no-pull-request-target
    languages: [yaml]
    severity: ERROR
    paths:
      include:
        - ".github/workflows/**"
        - "**/.github/workflows/**"
    message: Do not use pull_request_target in GitHub Actions workflows (privilege escalation risk).
    metadata:
      cwe: "CWE-284: Improper Access Control"
    pattern: |
      pull_request_target: ...
